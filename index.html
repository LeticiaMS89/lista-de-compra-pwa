<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <body>

  <div class="container">
    <h4>Minha Lista de Compras</h4>
    
    <div class="row formulario-produto">
      <div class="input-field col s12 m5">
        <input id="nomeProduto" type="text" class="validate">
        <label for="nomeProduto">Nome do Produto</label>
      </div>
      
      <div class="input-field col s6 m2">
        <input id="qtdProduto" type="number" value="1" min="1" class="validate">
        <label for="qtdProduto" class="active">Qtd</label>
      </div>
      
      <div class="input-field col s6 m3">
        <input id="valorProduto" type="number" step="0.01" min="0" class="validate">
        <label for="valorProduto">Valor Unitário (R$)</label>
      </div>
      
      <div class="col s12 m2 btn-container">
        <button class="btn blue waves-effect waves-light" onclick="adicionarProduto()" style="width: 100%; height: 45px;">
          <i class="material-icons">add</i>
        </button>
      </div>
    </div>

    <div class="row">
      <div class="col s12 table-responsive">
        <table class="striped">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Valor</th>
              <th>Total</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </div>
    </div>

    <div class="total-box">
      <h5>Total da Compra: <span id="totalCompra">R$ 0,00</span></h5>
    </div>

    <div class="acoes-container" style="margin-top: 40px; clear: both;">
      
      <div class="row" style="margin-bottom: 15px;">
        <div class="input-field col s12 m6">
          <input id="nomeListaSalvar" type="text" placeholder="Ex: Compras do Mês, Churrasco...">
          <label for="nomeListaSalvar" class="active">Nome da Lista (Opcional)</label>
        </div>
      </div>

      <div class="acoes">
        <button class="btn green waves-effect waves-light" onclick="salvarLista()">
          <i class="material-icons left">save</i> Salvar Lista
        </button>

        <button class="btn orange darken-3 waves-effect waves-light" onclick="limparLista()">
          <i class="material-icons left">remove_shopping_cart</i> Esvaziar Lista Atual
        </button>

        <button class="btn blue-grey darken-1 waves-effect waves-light modal-trigger" data-target="modalListas">
          <i class="material-icons left">folder_open</i> Listas Salvas
        </button>

        <button class="btn red waves-effect waves-light" onclick="apagarTodoOHistorico()">
          <i class="material-icons left">delete_forever</i> Limpar Tudo (Sistema)
        </button>
      </div>

    </div>
  </div>

  <div id="modalListas" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h4 style="margin: 0;">Listas Salvas</h4>
        <button class="btn-flat red-text waves-effect" onclick="apagarTodasAsListasSalvas()" style="font-weight: 600;">
          <i class="material-icons left">delete_sweep</i> Apagar Todas
        </button>
      </div>
      <ul class="collection" id="listasSalvas"></ul>
    </div>
    <div class="modal-footer">
      <a href="#!" class="modal-close btn-flat">Fechar</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
